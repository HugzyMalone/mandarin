<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mandarin Flashcards</title>
<meta name="description" content="Mandarin vocab flashcards with a leaderboard for every lesson.">
<meta name="theme-color" content="#f2ebdd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1a18" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mandarin">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
:root{
  --paper:#f6f3eb;--sheet:#fffdf7;--ink:#202321;--muted:#686d69;--rule:#c9c5ba;--rule-dark:#7a7d77;
  --red:#b8322a;--red-soft:#f0dcd6;--blue:#315c7d;--blue-soft:#dce8ee;--green:#316747;
  --sans:Arial,"Helvetica Neue",system-ui,sans-serif;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  --han:"Noto Serif SC","Songti SC","STSong",serif;color-scheme:light
}
@media(prefers-color-scheme:dark){:root{
  --paper:#171918;--sheet:#202321;--ink:#ecece5;--muted:#a2a7a2;--rule:#3f4541;--rule-dark:#888e89;
  --red:#ef7367;--red-soft:#3d2926;--blue:#8eb8d3;--blue-soft:#263740;--green:#85b996;color-scheme:dark
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--paper)}
body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font:16px/1.45 var(--sans);padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 42px);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.view{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:30px}
button,input{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer;border:0;background:none;border-radius:0;padding:0;min-height:44px}
button:focus-visible,input:focus-visible,.card:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.zh{font-family:var(--han);font-weight:500}
h1,h2,p{margin-top:0}
h1{margin-bottom:0;font-size:clamp(2.35rem,9vw,4.4rem);line-height:.96;letter-spacing:-.055em;font-weight:800}
h2{margin-bottom:0;font-size:1.4rem;line-height:1.1}
.sub{color:var(--muted);margin:8px 0 0;max-width:42ch}
.proto{position:fixed;right:0;top:0;z-index:20;background:var(--ink);color:var(--paper);font:700 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:7px 9px}
.label{margin:0 0 8px;font:700 11px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.btn,.primary{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 18px;border:1.5px solid var(--ink);background:transparent;font-weight:700}
.btn.primary,.primary{background:var(--ink);color:var(--paper)}
.btn.seal{background:var(--red);border-color:var(--red);color:#fff}
.link{display:inline-flex;align-items:center;gap:7px;color:var(--ink);font-weight:700}
.link svg{width:18px;height:18px}
.mast{display:flex;justify-content:space-between;align-items:center;padding:5px 0 15px;border-bottom:2px solid var(--ink)}
.stamp{width:40px;height:40px;display:grid;place-items:center;background:var(--red);color:#fff;font-family:var(--han);font-size:1.35rem;font-weight:700}
.langs{display:flex;align-items:center;gap:5px}
.langs button{padding:0 12px;color:var(--muted);font-weight:700}
.langs button[aria-pressed="true"]{color:var(--ink);text-decoration:underline 3px var(--red);text-underline-offset:7px}
.intro{display:grid;grid-template-columns:minmax(0,1fr) minmax(170px,.42fr);gap:24px;align-items:end;padding:14px 0 8px}
.intro .sub{font-size:1.02rem;border-left:3px solid var(--red);padding-left:13px;margin-bottom:4px}
.standings{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--rule-dark);border-bottom:1px solid var(--rule-dark)}
.standings>div{padding:13px 12px;border-left:1px solid var(--rule)}
.standings>div:first-child{border-left:0;padding-left:0}
.standings .n{font:700 1.7rem/1 var(--mono)}
.standings .who{margin-top:5px;font:700 12px/1.2 var(--sans);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.standings .lead .n{color:var(--red)}
.standings .sub{font-size:.9rem}
.standings>div:only-child{grid-column:1/-1;border-left:0}
.lessons{display:flex;flex-direction:column;counter-reset:lesson}
.lesson{counter-increment:lesson;display:grid;grid-template-columns:46px 1fr minmax(72px,auto);gap:12px;align-items:center;width:100%;min-height:72px;padding:10px 0;text-align:left;border-top:1px solid var(--rule)}
.lesson:first-child{border-top:2px solid var(--ink)}
.lesson:last-child{border-bottom:2px solid var(--ink)}
.lesson::before{content:counter(lesson,decimal-leading-zero);font:600 .85rem/1 var(--mono);color:var(--blue)}
.lesson:hover,.lesson:active{background:var(--blue-soft)}
.lesson .name{font-size:1.12rem;font-weight:800}
.lesson .meta{color:var(--muted);font:12px/1.3 var(--mono);margin-top:3px}
.lesson .best{text-align:right;color:var(--muted);font-size:.78rem}
.lesson .best b{display:block;color:var(--ink);font:700 1.1rem/1.1 var(--mono)}
.lesson .best.none{font-style:italic}
.chev{display:none}
.foot{display:flex}
.foot .btn{width:100%}
.top{display:flex;flex-direction:column;align-items:flex-start;gap:18px}
.top .grow{width:100%}
.lesson-head{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;padding-bottom:18px;border-bottom:2px solid var(--ink)}
.lesson-head h1{font-size:clamp(2.2rem,8vw,3.8rem)}
.actions{display:grid;grid-template-columns:1.3fr 1fr;gap:8px}
.actions .btn{width:100%}
.board ol{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
.board li{display:grid;grid-template-columns:42px 1fr auto;gap:2px 10px;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--rule)}
.board .rank{grid-row:span 2;color:var(--muted);font:700 1rem var(--mono)}
.board .nm{font-weight:800}
.board .pts{grid-row:span 2;font:700 1.2rem var(--mono)}
.board .det{color:var(--muted);font-size:.8rem}
.board li:first-child .rank,.board li:first-child .pts{color:var(--red)}
.board li.me{background:var(--blue-soft)}
.board .empty{margin:0;padding:18px 0;border-top:2px solid var(--ink);border-bottom:1px solid var(--rule);color:var(--muted)}
.hudbar{display:grid;grid-template-columns:52px 1fr 100px;align-items:center;border-top:2px solid var(--ink);border-bottom:1px solid var(--ink)}
.hud{display:contents}
#quit{border-right:1px solid var(--rule);display:grid;place-items:center}
#quit svg{width:19px;height:19px}
.hud .q{text-align:center;color:var(--muted);font:600 .85rem var(--mono)}
.hud .score{text-align:right;padding-right:10px;font:700 1.5rem var(--mono);color:var(--red)}
.timer{height:5px;background:var(--rule);margin-top:-30px}
.timer i{display:block;height:100%;width:100%;background:var(--red);transform-origin:left}
.card{position:relative;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:7px;padding:34px 24px;background:var(--sheet);border:2px solid var(--ink);box-shadow:7px 7px 0 var(--rule)}
.card .ask{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card .word{font-size:clamp(2rem,9vw,3.25rem);font-weight:800;line-height:1.06}
.card .word.zh{font-family:var(--han);font-size:clamp(4rem,18vw,7rem);font-weight:500;letter-spacing:.04em}
.card .py{color:var(--blue);font-size:1.2rem}
.card .hint{margin-top:14px;color:var(--muted);font-size:.88rem}
.card .reveal{width:min(84%,420px);margin-top:18px;padding-top:15px;border-top:1px solid var(--rule-dark)}
.card .reveal .en{font-size:1.35rem;font-weight:800}
.card .reveal .zh{font-size:2.7rem}
.card .primary{margin-top:14px}
.pop{position:absolute;top:14px;right:16px;color:var(--green);font:700 1.1rem var(--mono)}
.pop.miss{color:var(--red)}
.options{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.options button{position:relative;min-height:74px;text-align:left;padding:12px 46px 12px 14px;background:var(--sheet);border:1.5px solid var(--rule-dark);font-weight:700}
.options button::after{content:"";position:absolute;right:13px;top:50%;width:14px;height:14px;margin-top:-7px;border:1px solid var(--rule-dark)}
.options button:hover:not(:disabled){border-color:var(--ink)}
.options .zh{font-size:1.65rem}
.options .opt-py{display:block;color:var(--blue);font-size:.83rem;font-weight:400}
.options button.right{background:var(--blue-soft);border-color:var(--green)}
.options button.right::after{background:var(--green);border-color:var(--green)}
.options button.wrong{background:var(--red-soft);border-color:var(--red)}
.options button.wrong::after{background:var(--red);border-color:var(--red)}
.options button:disabled:not(.right):not(.wrong){opacity:.42}
.row{display:flex;gap:8px}
.row>button{flex:1}
.seg{border-bottom:1px solid var(--rule-dark)}
.seg button{padding:0 14px;color:var(--muted);font-weight:700}
.seg button:first-child{padding-left:0}
.seg button[aria-pressed="true"]{color:var(--ink);text-decoration:underline 3px var(--blue);text-underline-offset:7px}
.progress{display:flex;justify-content:space-between;margin-bottom:8px;color:var(--muted);font:600 .8rem var(--mono)}
.bar{height:5px;background:var(--rule)}
.bar i{display:block;height:100%;width:0;background:var(--blue)}
#practice .card{min-height:330px;cursor:pointer}
#pTitle{font-size:2rem}
.grade{gap:8px}
.again,.gotit{min-height:54px;border:1.5px solid var(--ink);font-weight:800}
.gotit{background:var(--ink);color:var(--paper)}
.result{display:flex;flex-direction:column;align-items:flex-start;padding:22px 0;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.result .label{margin:0}
.result .final{font:800 clamp(4rem,18vw,7rem)/.95 var(--mono);letter-spacing:-.08em}
.result .sub{font-size:1rem}
.result .rankline{margin:12px 0 0;padding:6px 9px;background:var(--red);color:#fff;font-weight:700}
.result .rankline:empty{display:none}
.arcade{display:flex;flex-direction:column;gap:14px}
.arcade input{width:100%;padding:9px 0;border:0;border-bottom:2px solid var(--ink);background:transparent;border-radius:0;font:700 2rem var(--mono);letter-spacing:.14em;text-transform:uppercase}
.arcade input:focus{outline:0;border-bottom-color:var(--blue)}
.arcade .btn{width:100%}
.msg{margin:0;color:var(--red);font-weight:700}
.after{justify-content:flex-start}
.after button{flex:0 auto;text-decoration:underline;text-underline-offset:5px;font-weight:700}
.search{position:sticky;top:0;z-index:3;display:flex;gap:10px;padding:10px 0;background:var(--paper);border-bottom:2px solid var(--ink)}
.search input{flex:1;min-width:0;padding:10px 0;border:0;background:transparent}
.search input:focus{outline:0}
.search button{padding:0 8px;font-weight:700}
.search button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.words{display:flex;flex-direction:column;gap:28px}
.words h2{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:7px;border-bottom:2px solid var(--ink)}
.words h2 span{font:500 .75rem var(--mono);color:var(--muted)}
.w{display:grid;grid-template-columns:minmax(100px,34%) 1fr;gap:0 16px;padding:10px 0;border-bottom:1px solid var(--rule)}
.w .zh{grid-row:span 2;align-self:center;font-size:1.5rem}
.w .py{color:var(--blue);font-size:.88rem}
.w .en{color:var(--ink)}
.hide-en .w .en{color:transparent;background:var(--rule)}
@media(max-width:580px){
  .proto{position:absolute}
  .intro{grid-template-columns:1fr;gap:12px}
  .intro .sub{margin:0}
  .lesson-head{grid-template-columns:1fr}
  .options{grid-template-columns:1fr}
  .card{min-height:230px;box-shadow:5px 5px 0 var(--rule)}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m6-6-6 6 6 6"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></symbol>
</svg>

<main class="view" id="home">
  <header class="mast">
    <span class="stamp zh" lang="zh-CN" aria-hidden="true">学</span>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="zh" aria-pressed="true">Mandarin</button>
      <button type="button" data-lang="de" aria-pressed="false">German</button>
    </div>
  </header>
  <div class="intro">
    <h1 id="homeTitle">Mandarin flashcards</h1>
    <p class="sub">Pick a lesson, play for points, put your name on the board.</p>
  </div>
  <section>
    <p class="label">Lessons won</p>
    <div class="standings" id="standings"></div>
  </section>
  <section>
    <p class="label">Contents</p>
    <div class="lessons" id="lessonList"></div>
  </section>
  <div class="foot"><button type="button" class="btn" id="openWords">Full word list</button></div>
</main>

<main class="view" id="lesson" hidden>
  <div class="top">
    <button type="button" class="link" data-home aria-label="Back to lessons"><svg><use href="#i-back"/></svg>Lessons</button>
    <div class="grow lesson-head"><h1 id="lessonTitle"></h1><p class="sub" id="lessonMeta"></p></div>
  </div>
  <div class="actions">
    <button type="button" class="btn primary" id="play">Play for score</button>
    <button type="button" class="btn" id="practise">Practise</button>
  </div>
  <section>
    <p class="label">Leaderboard</p>
    <div class="board" id="board"></div>
  </section>
</main>

<main class="view" id="game" hidden>
  <div class="top hudbar">
    <button type="button" class="link" id="quit" aria-label="Quit this round"><svg><use href="#i-x"/></svg>Quit</button>
    <div class="grow hud"><span class="q" id="qNum"></span><span class="score" id="gScore">0</span></div>
  </div>
  <div class="timer"><i id="timerFill"></i></div>
  <div class="card" id="qCard" aria-live="polite"></div>
  <div class="options" id="options"></div>
</main>

<main class="view" id="result" hidden>
  <div class="result">
    <p class="label" id="rLesson"></p>
    <div class="final" id="rScore"></div>
    <p class="sub" id="rDetail"></p>
    <p class="rankline" id="rRank"></p>
  </div>
  <form class="arcade" id="nameForm">
    <p class="label">Sign the board</p>
    <input id="nameInput" maxlength="12" autocomplete="nickname" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="Your name" required>
    <button type="submit" class="btn seal" id="saveBtn">Save to leaderboard</button>
    <p class="msg" id="saveMsg" hidden></p>
  </form>
  <div class="row after">
    <button type="button" id="replay">Play again</button>
    <button type="button" id="skipSave">Don't save</button>
  </div>
</main>

<main class="view" id="practice" hidden>
  <div class="top">
    <button type="button" class="link" id="endPractice" aria-label="Back to lesson"><svg><use href="#i-back"/></svg>Back</button>
    <div class="grow"><h2 id="pTitle"></h2></div>
  </div>
  <div class="row seg">
    <button type="button" data-dir="zh" aria-pressed="true" id="dirTarget">Chinese first</button>
    <button type="button" data-dir="en" aria-pressed="false">English first</button>
  </div>
  <div>
    <div class="progress"><span id="pLeft"></span><span id="pKnown"></span></div>
    <div class="bar"><i id="pBar"></i></div>
  </div>
  <div class="card" id="pCard" role="button" tabindex="0" aria-label="Flip card"></div>
  <div class="row grade" id="pGrade">
    <button type="button" class="btn again" id="pAgain">Again</button>
    <button type="button" class="btn seal gotit" id="pGot">Got it</button>
  </div>
</main>

<main class="view" id="words" hidden>
  <div class="top">
    <button type="button" class="link" data-home aria-label="Back to lessons"><svg><use href="#i-back"/></svg>Lessons</button>
    <div class="grow"><h1>Word list</h1></div>
  </div>
  <div class="search">
    <input id="q" type="search" placeholder="Search Chinese, pinyin or English"  aria-label="Search vocabulary">
    <button type="button" id="toggleEn" aria-pressed="false">Hide English</button>
  </div>
  <div class="words" id="wordList"></div>
</main>

  de:{data:DE,title:"German flashcards",doc:"German Flashcards",first:"German first",search:"Search German or English",cls:"de",tag:"de",key:n=>"de:"+n,nameKey:"mandarin-name"}
};
let lang="zh";
let D=LANG[lang].data;
const L=()=>LANG[lang];
const fw=(w,cls="")=>`<span class="${cls} ${L().cls}" lang="${L().tag}">${esc(w[0])}</span>`;
const pyOf=w=>w[1]?`<span class="py">${esc(w[1])}</span>`:"";
const words=name=>{const seen=new Set();return D.find(d=>d[0]===name)[1].filter(w=>{const k=w[0]+"|"+w[2];if(seen.has(k))return false;seen.add(k);return true})};

let scores=[],scoresError=false,current=null,lastSavedId=null;

function show(id){
  document.querySelectorAll("main.view").forEach(v=>v.hidden=v.id!==id);
  window.scrollTo(0,0);
}

async function api(path,opts={}){
  const res=await fetch(`${SUPABASE_URL}/rest/v1/${path}`,{...opts,headers:{apikey:SUPABASE_KEY,"Content-Type":"application/json",...opts.headers}});
  if(!res.ok)throw new Error(`${res.status}`);
  return res.status===204?null:res.json();
}

async function loadScores(){
  try{scores=await api("scores?select=id,lesson,name,score,correct,total,created_at&order=score.desc,created_at.asc&limit=5000");scoresError=false}
  catch{scoresError=true}
}

const boardFor=lesson=>scores.filter(s=>s.lesson===L().key(lesson));

function renderHome(){
  const wins={};
  for(const [name] of D){const top=boardFor(name)[0];if(top)wins[top.name]=(wins[top.name]||0)+1}
  const ranked=Object.entries(wins).sort((a,b)=>b[1]-a[1]);
  $("standings").innerHTML=scoresError?`<div><div class="who">Scores could not load</div><div class="sub">Check your connection and reopen.</div></div>`:
    ranked.length?ranked.slice(0,3).map(([n,c],i)=>`<div class="${i===0&&c>(ranked[1]?.[1]||0)?"lead":""}"><div class="n">${c}</div><div class="who">${esc(n)}</div></div>`).join(""):
    `<div><div class="who">No scores yet</div><div class="sub">Play a lesson to claim it.</div></div>`;
  $("lessonList").innerHTML=D.map(([name])=>{
    const top=boardFor(name)[0];
    return `<button type="button" class="lesson" data-lesson="${esc(name)}"><div class="grow"><div class="name">${esc(name)}</div><div class="meta">${words(name).length} words</div></div><div class="best${top?"":" none"}">${top?`<b>${fmt(top.score)}</b>${esc(top.name)}`:"Unclaimed"}</div><svg class="chev"><use href="#i-next"/></svg></button>`;
  }).join("");
}

function renderBoard(lesson){
  const rows=boardFor(lesson).slice(0,10);
  if(scoresError){$("board").innerHTML=`<p class="empty">Scores could not load. Check your connection.</p>`;return}
  $("board").innerHTML=rows.length?`<ol>${rows.map((s,i)=>`<li class="${s.id===lastSavedId?"me":""}"><span class="rank">${i+1}</span><span class="nm">${esc(s.name)}</span><span class="pts">${fmt(s.score)}</span><span class="det">${s.correct} of ${s.total} right · ${new Date(s.created_at).toLocaleDateString("en-GB",{day:"numeric",month:"short"})}</span></li>`).join("")}</ol>`:
    `<p class="empty">No scores yet. First to play takes the top spot.</p>`;
}

function openLesson(name){
  current=name;
  $("lessonTitle").textContent=name;
  $("lessonMeta").textContent=`${words(name).length} words`;
  renderBoard(name);
  show("lesson");
}

function setLang(l){
  lang=l;D=LANG[l].data;store.set("flash-lang",l);
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===l));
  $("homeTitle").textContent=L().title;
  document.title=L().doc;
  $("dirTarget").textContent=L().first;
  $("q").placeholder=L().search;
  renderHome();
}
document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>{if(b.dataset.lang!==lang){store.set("flash-lang",b.dataset.lang);location.href="german/"}}));

$("lessonList").addEventListener("click",e=>{const b=e.target.closest("[data-lesson]");if(b)openLesson(b.dataset.lesson)});
document.querySelectorAll("[data-home]").forEach(b=>b.addEventListener("click",()=>{renderHome();show("home")}));

let G=null,raf=0;

function startGame(){
  const pool=words(current);
  G={lesson:current,pool,questions:shuffle([...pool]).map(w=>({w,dir:Math.random()<.5?"zh":"en"})),i:0,score:0,correct:0,locked:false,start:0};
  show("game");
  nextQuestion();
}

function nextQuestion(){
  cancelAnimationFrame(raf);
  if(G.i>=G.questions.length)return finishGame();
  const {w,dir}=G.questions[G.i];
  const others=shuffle(G.pool.filter(o=>o[0]!==w[0]&&o[2]!==w[2])).slice(0,3);
  const opts=shuffle([w,...others]);
  $("qNum").textContent=`${G.i+1} of ${G.questions.length}`;
  $("gScore").textContent=fmt(G.score);
  $("qCard").innerHTML=dir==="zh"
    ?`<span class="ask">What does this mean?</span><div class="word ${L().cls}" lang="${L().tag}">${esc(w[0])}</div>${w[1]?`<div class="py">${esc(w[1])}</div>`:""}`
    :`<span class="ask">How do you say</span><div class="word">${esc(w[2])}</div>`;
  $("options").innerHTML=opts.map(o=>`<button type="button" data-key="${esc(o[0]+"|"+o[2])}">${dir==="zh"?esc(o[2]):`${fw(o)}${o[1]?`<span class="opt-py">${esc(o[1])}</span>`:""}`}</button>`).join("");
  G.answer=w[0]+"|"+w[2];
  G.locked=false;
  G.start=performance.now();
  const tick=now=>{
    const left=Math.max(0,1-(now-G.start)/TIME_LIMIT);
    $("timerFill").style.transform=`scaleX(${left})`;
    if(left<=0)return answer(null);
    raf=requestAnimationFrame(tick);
  };
  raf=requestAnimationFrame(tick);
}

function answer(key){
  if(G.locked)return;
  G.locked=true;
  cancelAnimationFrame(raf);
  const left=Math.max(0,1-(performance.now()-G.start)/TIME_LIMIT);
  const ok=key===G.answer;
  const pts=ok?100+Math.round(100*left):0;
  G.score+=pts;
  if(ok)G.correct++;
  $("gScore").textContent=fmt(G.score);
  $("options").querySelectorAll("button").forEach(b=>{
    b.disabled=true;
    if(b.dataset.key===G.answer)b.classList.add("right");
    else if(b.dataset.key===key)b.classList.add("wrong");
  });
  $("qCard").insertAdjacentHTML("beforeend",`<span class="pop ${ok?"":"miss"}">${ok?`+${pts}`:key===null?"Time up":"Miss"}</span>`);
  G.i++;
  setTimeout(()=>{if(G&&!$("game").hidden)nextQuestion()},ok?750:1600);
}

$("options").addEventListener("click",e=>{const b=e.target.closest("button");if(b&&G)answer(b.dataset.key)});
$("quit").addEventListener("click",()=>{cancelAnimationFrame(raf);G=null;openLesson(current)});

function finishGame(){
  const board=boardFor(G.lesson);
  const rank=board.filter(s=>s.score>G.score).length+1;
  $("rLesson").textContent=G.lesson;
  $("rScore").textContent=fmt(G.score);
  $("rDetail").textContent=`${G.correct} of ${G.questions.length} right`;
  $("rRank").textContent=rank===1?(board.length?"New top score":"First score on this lesson"):rank<=10?`That would be number ${rank} on the board`:"";
  $("nameInput").value=store.get("mandarin-name")||"";
  $("saveMsg").hidden=true;
  $("saveBtn").disabled=false;
  $("saveBtn").textContent="Save to leaderboard";
  show("result");
}

$("nameForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const name=$("nameInput").value.trim().toUpperCase().slice(0,12);
  if(!name||!G)return;
  if(PREVIEW){$("saveMsg").textContent="Design preview: scores are not saved here.";$("saveMsg").hidden=false;return}
  $("saveBtn").disabled=true;
  $("saveBtn").textContent="Saving";
  try{
    const [row]=await api("scores",{method:"POST",headers:{Prefer:"return=representation"},body:JSON.stringify({lesson:L().key(G.lesson),name,score:G.score,correct:G.correct,total:G.questions.length})});
    store.set("mandarin-name",name);
    lastSavedId=row.id;
    await loadScores();
    G=null;
    openLesson(current);
  }catch{
    $("saveMsg").textContent="Could not save. Check your connection and try again.";
    $("saveMsg").hidden=false;
    $("saveBtn").disabled=false;
    $("saveBtn").textContent="Try again";
  }
});
$("replay").addEventListener("click",startGame);
$("skipSave").addEventListener("click",()=>{G=null;openLesson(current)});
$("play").addEventListener("click",startGame);

let P=null,pDir="zh";
function startPractice(){
  P={deck:shuffle(words(current).map(w=>[...w])),total:0,known:0,flipped:false};
  P.total=P.deck.length;
  $("pTitle").textContent=current;
  show("practice");
  drawPractice();
}
function drawPractice(){
  const {deck,total,known,flipped}=P;
  $("pLeft").textContent=`${deck.length} left`;
  $("pKnown").textContent=`${known} of ${total} known`;
  $("pBar").style.width=`${known/total*100}%`;
  $("pGrade").hidden=!deck.length||!flipped;
  if(!deck.length){
    $("pCard").innerHTML=`<div class="word">All ${total} done</div><p class="hint">Ready to play this lesson for points?</p><button type="button" class="primary" id="pToGame">Play for score</button>`;
    $("pToGame").addEventListener("click",e=>{e.stopPropagation();startGame()});
    return;
  }
  const [zh,py,en]=deck[0];
  const tgt=cls=>`<div class="${cls} ${L().cls}" lang="${L().tag}">${esc(zh)}</div>${py?`<div class="py">${esc(py)}</div>`:""}`;
  const front=pDir==="zh"?tgt("word"):`<div class="word">${esc(en)}</div>`;
  const back=pDir==="zh"?`<div class="en">${esc(en)}</div>`:tgt("");
  $("pCard").innerHTML=front+(flipped?`<div class="reveal">${back}</div>`:`<span class="hint">Tap to reveal</span>`);
}
function pGrade(ok){
  if(!P.deck.length||!P.flipped)return;
  const c=P.deck.shift();
  if(ok)P.known++;else P.deck.splice(Math.min(P.deck.length,3+Math.floor(Math.random()*4)),0,c);
  P.flipped=false;
  drawPractice();
}
$("practise").addEventListener("click",startPractice);
$("endPractice").addEventListener("click",()=>openLesson(current));
$("pCard").addEventListener("click",()=>{if(P.deck.length){P.flipped=!P.flipped;drawPractice()}});
$("pAgain").addEventListener("click",()=>pGrade(false));
$("pGot").addEventListener("click",()=>pGrade(true));
document.querySelectorAll("[data-dir]").forEach(b=>b.addEventListener("click",()=>{
  pDir=b.dataset.dir;
  document.querySelectorAll("[data-dir]").forEach(x=>x.setAttribute("aria-pressed",x===b));
  P.flipped=false;
  drawPractice();
}));

function renderWords(){
  const term=strip($("q").value.trim());
  let html="";
  for(const [name,list] of D){
    const rows=list.filter(w=>!term||w.some(x=>strip(x).includes(term)));
    if(!rows.length)continue;
    html+=`<section><h2>${esc(name)}<span>${rows.length} words</span></h2>${rows.map(w=>`<div class="w">${fw(w)}${pyOf(w)}<span class="en">${esc(w[2])}</span></div>`).join("")}</section>`;
  }
  $("wordList").innerHTML=html||`<p class="sub">No words match “${esc($("q").value)}”.</p>`;
}
$("openWords").addEventListener("click",()=>{renderWords();show("words")});
$("q").addEventListener("input",renderWords);
$("toggleEn").addEventListener("click",e=>{
  const on=e.currentTarget.getAttribute("aria-pressed")!=="true";
  e.currentTarget.setAttribute("aria-pressed",on);
  e.currentTarget.textContent=on?"Show English":"Hide English";
  $("wordList").classList.toggle("hide-en",on);
});

document.addEventListener("visibilitychange",async()=>{
  if(document.visibilityState==="visible"&&(!$("home").hidden||!$("lesson").hidden)){
    await loadScores();
    if(!$("home").hidden)renderHome();else renderBoard(current);
  }
});

if(store.get("flash-lang")==="de")location.replace("german/");
setLang(lang);
loadScores().then(renderHome);
</script>
</body>
</html>
