<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mandarin Flashcards</title>
<meta name="description" content="Mandarin vocab flashcards with a leaderboard for every lesson.">
<meta name="theme-color" content="#121211">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mandarin">
<link rel="apple-touch-icon" href="../../icon-180.png">
<link rel="icon" href="../../icon-180.png">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+SC:wght@400;500&display=swap">
<style>
:root{--bg:#f1f0eb;--ink:#121211;--soft:#3b3b38;--muted:#76756e;--hair:#d3d1c8;--sig:#e2401c;--sig-ink:#fff;--sel:#e5e3dc;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e0d;--ink:#ecebe5;--soft:#c2c1ba;--muted:#86857e;--hair:#2c2c29;--sig:#ff5b33;--sig-ink:#0e0e0d;--sel:#1c1c1a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0e0d;--ink:#ecebe5;--soft:#c2c1ba;--muted:#86857e;--hair:#2c2c29;--sig:#ff5b33;--sig-ink:#0e0e0d;--sel:#1c1c1a;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Inter Tight",system-ui,sans-serif;padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 40px);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
.view{max-width:560px;margin:0 auto;display:flex;flex-direction:column}
button,input{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer;border:0;background:none;border-radius:0;padding:0 14px;min-height:48px;font-weight:600;letter-spacing:-.005em}
button:focus-visible,input:focus-visible,.card:focus-visible{outline:2px solid var(--sig);outline-offset:3px}
.num,.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.zh{font-family:"Noto Sans SC","PingFang SC",sans-serif;font-weight:500}
h1{font-size:2.75rem;line-height:.98;letter-spacing:-.045em;margin:0;font-weight:700;text-wrap:balance}
h2{font-size:1.25rem;letter-spacing:-.02em;margin:0;font-weight:600}
.sub{color:var(--muted);margin:10px 0 0;font-size:1rem;max-width:30ch}
.primary{background:var(--ink);color:var(--bg)}
.primary:active{background:var(--sig);color:var(--sig-ink)}
.ghost{box-shadow:inset 0 0 0 1.5px var(--ink)}
.ghost:active{background:var(--sel)}

.masthead{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--ink);margin-bottom:28px}
.masthead .mark{font-family:"JetBrains Mono",monospace;font-size:.8rem;color:var(--muted)}
.masthead .mark b{color:var(--sig);font-weight:700}
.langs{display:flex}
.langs button{padding:0;margin-left:20px;color:var(--muted);font-weight:500;position:relative}
.langs button[aria-pressed="true"]{color:var(--ink);font-weight:600}
.langs button[aria-pressed="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;background:var(--sig)}

.section{margin-top:40px}
.label{display:flex;justify-content:space-between;align-items:baseline;font-size:.95rem;font-weight:600;margin:0;padding-bottom:10px;border-bottom:1px solid var(--ink)}
.label .mono{font-size:.75rem;font-weight:400;color:var(--muted)}

.standings{display:grid;grid-template-columns:repeat(3,1fr)}
.standings>div{padding:14px 12px 4px 0;min-width:0}
.standings>div+div{padding-left:12px;border-left:1px solid var(--hair)}
.standings .n{font-family:"JetBrains Mono",monospace;font-size:2.6rem;font-weight:500;line-height:1;letter-spacing:-.06em}
.standings .who{font-weight:600;margin-top:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.95rem}
.standings .lead .n{color:var(--sig)}
.standings .msg-cell{grid-column:1/-1;padding:14px 0 0}
.standings .msg-cell .sub{margin-top:2px}

.lessons{display:flex;flex-direction:column}
.lesson{display:grid;grid-template-columns:1.9em 1fr auto;align-items:baseline;column-gap:8px;text-align:left;width:100%;padding:15px 0;min-height:60px;border-bottom:1px solid var(--hair)}
.lesson:active{background:var(--sel)}
.lesson .idx{font-family:"JetBrains Mono",monospace;font-size:.78rem;color:var(--muted);font-weight:400}
.lesson .name{font-weight:600;font-size:1.15rem;letter-spacing:-.02em;line-height:1.2}
.lesson .meta{font-family:"JetBrains Mono",monospace;color:var(--muted);font-size:.75rem;font-weight:400;margin-top:3px}
.lesson .best{text-align:right;font-size:.8rem;font-weight:500;color:var(--muted)}
.lesson .best b{display:block;color:var(--ink);font-family:"JetBrains Mono",monospace;font-size:1rem;font-weight:500;letter-spacing:-.03em}
.lesson .best .none{font-family:"JetBrains Mono",monospace;font-size:.75rem;font-weight:400}
.lesson:hover .name{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px}
.link-row{display:flex;justify-content:space-between;align-items:center;width:100%;padding:0;min-height:64px;margin-top:32px;border-top:2px solid var(--ink);border-bottom:1px solid var(--hair);font-size:1.15rem;letter-spacing:-.02em}
.link-row svg,.back svg{width:20px;height:20px}

.top{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--ink);margin-bottom:24px}
.back{display:inline-flex;align-items:center;gap:6px;padding:0 12px 0 0;font-weight:500;color:var(--soft)}
.back svg{margin-left:-4px}
.top .crumb{font-family:"JetBrains Mono",monospace;font-size:.75rem;color:var(--muted)}
.lesson-head h1{font-size:3rem}
.lesson-head .sub{font-family:"JetBrains Mono",monospace;font-size:.8rem;margin-top:12px}
.actions{display:grid;grid-template-columns:1.6fr 1fr;gap:8px;margin-top:28px}
.actions button{min-height:88px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;padding:12px 14px;font-size:1.1rem}
.actions button small{font-family:"JetBrains Mono",monospace;font-size:.7rem;font-weight:400;opacity:.7}

.board ol{list-style:none;margin:0;padding:0}
.board li{display:grid;grid-template-columns:1.9em 1fr auto;column-gap:8px;align-items:baseline;padding:13px 0;border-bottom:1px solid var(--hair)}
.board .rank{font-family:"JetBrains Mono",monospace;color:var(--muted);font-size:.8rem}
.board li:first-child .rank{color:var(--sig);font-weight:700}
.board .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:1.05rem}
.board .pts{font-family:"JetBrains Mono",monospace;font-weight:500;text-align:right;font-size:1.05rem;letter-spacing:-.03em}
.board li:first-child .pts{font-size:1.3rem}
.board .det{grid-column:2/4;color:var(--muted);font-size:.75rem;font-family:"JetBrains Mono",monospace;margin-top:2px}
.board li.me{background:var(--sel);box-shadow:inset 3px 0 0 var(--sig)}
.board .empty{padding:16px 0;color:var(--muted);margin:0}

#game .top{border-bottom:0;margin-bottom:0;align-items:flex-end}
.quit{padding:0 12px 0 0;display:inline-flex;align-items:center;gap:6px;color:var(--soft);font-weight:500;align-self:center}
.quit svg{width:18px;height:18px}
.hud{display:flex;flex-direction:column;align-items:flex-end}
.hud .q{font-family:"JetBrains Mono",monospace;font-size:.75rem;color:var(--muted)}
.hud .score{font-family:"JetBrains Mono",monospace;font-size:2.8rem;font-weight:500;line-height:1;letter-spacing:-.06em;font-variant-numeric:tabular-nums}
.timer{position:relative;height:10px;margin:14px 0 0;border-bottom:2px solid var(--ink);background:repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px 10%) left bottom/100% 6px no-repeat}
.timer i{position:absolute;left:0;right:0;bottom:-2px;height:4px;background:var(--sig);transform-origin:left}

.card{position:relative;padding:28px 0 24px;min-height:200px;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:4px;text-align:left}
.card .ask{font-size:.95rem;font-weight:500;color:var(--muted);margin-bottom:auto}
.card .word{font-size:clamp(2rem,9vw,2.6rem);font-weight:600;letter-spacing:-.035em;line-height:1.05;text-wrap:balance;margin-top:18px}
.card .word.zh{font-size:clamp(4rem,22vw,6rem);font-weight:500;line-height:1.05;letter-spacing:0}
.card .py{color:var(--sig);font-size:1.25rem;font-weight:500}
.card .hint{color:var(--muted);font-size:.75rem;font-family:"JetBrains Mono",monospace;margin-top:14px}
.card .reveal{margin-top:18px;padding-top:14px;border-top:1px solid var(--ink);align-self:stretch;display:flex;flex-direction:column;gap:2px}
.card .reveal .en{font-size:1.5rem;font-weight:600;letter-spacing:-.025em}
.card .reveal .zh{font-size:3rem;line-height:1.1}
.pop{position:absolute;top:28px;right:0;font-family:"JetBrains Mono",monospace;font-weight:700;color:var(--ink);font-size:1.1rem;animation:pop .5s cubic-bezier(.2,.7,.2,1)}
.pop.miss{color:var(--sig)}
@keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}

.options{display:flex;flex-direction:column;border-top:1px solid var(--ink);counter-reset:opt}
.options button{counter-increment:opt;min-height:64px;text-align:left;padding:10px 12px 10px 44px;font-size:1.1rem;font-weight:500;letter-spacing:-.015em;display:flex;flex-direction:column;justify-content:center;border-bottom:1px solid var(--hair);position:relative;transition:background .12s,color .12s}
.options button::before{content:counter(opt,upper-alpha);position:absolute;left:0;top:50%;transform:translateY(-50%);width:28px;font-family:"JetBrains Mono",monospace;font-size:.75rem;color:var(--muted);text-align:left;padding-left:12px}
.options button:active:not(:disabled){background:var(--sel)}
.options .zh{font-size:1.75rem;line-height:1.2}
.options .opt-py{font-size:.85rem;color:var(--muted);font-weight:400}
.options button.right{background:var(--ink);color:var(--bg)}
.options button.right::before,.options button.right .opt-py{color:var(--bg);opacity:.7}
.options button.wrong{color:var(--sig);box-shadow:inset 3px 0 0 var(--sig)}
.options button.wrong>:first-child,.options button.wrong:not(:has(span)){text-decoration:line-through;text-decoration-thickness:1.5px}
.options button.wrong .opt-py{color:var(--sig);opacity:.8}
.options button.wrong::before{color:var(--sig)}
.options button:disabled{cursor:default}
.options button:disabled:not(.right):not(.wrong){color:var(--muted)}

.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:flex;gap:0;margin-bottom:22px}
.seg button{padding:0;margin-right:20px;color:var(--muted);font-weight:500;position:relative}
.seg button[aria-pressed="true"]{color:var(--ink);font-weight:600}
.seg button[aria-pressed="true"]::after{content:"";position:absolute;left:0;right:0;bottom:8px;height:2px;background:var(--sig)}
.bar{height:2px;background:var(--hair);position:relative}
.bar i{position:absolute;left:0;top:-1px;height:4px;width:0;background:var(--ink);transition:width .25s}
.progress{display:flex;justify-content:space-between;color:var(--muted);font-size:.75rem;font-family:"JetBrains Mono",monospace;margin-bottom:8px}
#pCard{min-height:280px;margin:20px 0;padding:22px 20px;box-shadow:inset 0 0 0 1.5px var(--ink);cursor:pointer;justify-content:space-between}
#pCard .word{margin-top:0}
#pCard .hint{margin-top:auto}
#pCard .primary{margin-top:20px;padding:0 20px}
#pCard:active{background:var(--sel)}
.again{box-shadow:inset 0 0 0 1.5px var(--ink);min-height:56px}
.gotit{background:var(--ink);color:var(--bg);min-height:56px}

.result{display:flex;flex-direction:column;align-items:flex-start;border-top:2px solid var(--ink);padding-top:12px}
.result .label{border:0;padding:0;color:var(--muted);font-weight:500}
.result .final{font-family:"JetBrains Mono",monospace;font-size:clamp(4.2rem,22vw,6rem);font-weight:500;line-height:1;letter-spacing:-.08em;margin:48px 0 8px;font-variant-numeric:tabular-nums}
.result .sub{font-family:"JetBrains Mono",monospace;font-size:.85rem;margin:0}
.result .rankline{font-weight:600;color:var(--sig);margin:6px 0 0;font-size:1.1rem}
.arcade{display:flex;flex-direction:column;gap:14px;margin-top:40px}
.arcade .label{border:0;padding:0}
.arcade input{width:100%;font-family:"JetBrains Mono",monospace;font-size:1.9rem;font-weight:500;letter-spacing:.06em;text-transform:uppercase;padding:8px 0;border:0;border-bottom:2px solid var(--ink);border-radius:0;background:transparent;outline:none}
.arcade input:focus{border-bottom-color:var(--sig)}
.arcade input::placeholder{letter-spacing:0;font-weight:400;color:var(--hair);text-transform:none}
.arcade .primary{min-height:56px;font-size:1.05rem}
.msg{color:var(--sig);font-size:.85rem;margin:0}
#result .row{margin-top:10px;gap:0;border-top:1px solid var(--hair)}
#result .row button+button{box-shadow:inset 1px 0 0 var(--hair)}
.result .final::after{content:"pts";font-size:.9rem;letter-spacing:0;color:var(--muted);margin-left:8px;font-weight:400}
#result .row button{justify-content:center;color:var(--soft);font-weight:500}

.search{position:sticky;top:0;z-index:2;background:var(--bg);padding:calc(env(safe-area-inset-top) + 6px) 0 6px;margin-top:calc(-1 * env(safe-area-inset-top));display:flex;gap:8px;align-items:stretch;border-bottom:2px solid var(--ink)}
.search input{flex:1;min-width:0;font-size:16px;padding:12px 0;border:0;border-radius:0;background:transparent;outline:none}
.search input::placeholder{color:var(--muted)}
.search button{padding:0 0 0 12px;font-size:.85rem;font-weight:500;color:var(--soft);white-space:nowrap}
.search button[aria-pressed="true"]{color:var(--sig)}
.words{display:flex;flex-direction:column;gap:36px;margin-top:28px}
.words h2{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:10px;border-bottom:1px solid var(--ink)}
.words h2 span{font-family:"JetBrains Mono",monospace;font-size:.72rem;font-weight:400;color:var(--muted);letter-spacing:0}
.w{display:grid;grid-template-columns:auto 1fr;gap:0 16px;padding:11px 0;border-bottom:1px solid var(--hair);align-items:baseline}
.w .zh{font-size:1.45rem;grid-row:span 2;align-self:center;min-width:3.4em}
.w .py{color:var(--sig);font-size:.9rem}
.w .en{color:var(--soft)}
.hide-en .w .en{color:transparent;background:var(--sel)}
.w .de{font-weight:600;grid-row:span 2;align-self:center;min-width:8.5em;letter-spacing:-.015em}
.card .word.de{font-size:clamp(2.2rem,11vw,3rem)}
.card .reveal .de{font-size:2rem;font-weight:600;letter-spacing:-.03em}
.options .de{font-size:1.2rem;font-weight:600}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"><path d="M20 12H5m6-6-6 6 6 6"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"><path d="M4 12h15m-6-6 6 6-6 6"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square"><path d="M18 6 6 18M6 6l12 12"/></symbol>
</svg>

<main class="view" id="home">
  <div class="masthead">
    <span class="mark"><b>&#9632;</b> Flashcards</span>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="zh" aria-pressed="true">Mandarin</button>
      <button type="button" data-lang="de" aria-pressed="false">German</button>
    </div>
  </div>
  <div>
    <h1 id="homeTitle">Mandarin flashcards</h1>
    <p class="sub">Pick a lesson, play for points, put your name on the board.</p>
  </div>
  <div class="section">
    <p class="label">Lessons won <span class="mono">Top 3</span></p>
    <div class="standings" id="standings"></div>
  </div>
  <div class="section">
    <p class="label">Lessons <span class="mono">Best score</span></p>
    <div class="lessons" id="lessonList"></div>
  </div>
  <button type="button" class="link-row" id="openWords">Full word list <svg><use href="#i-next"/></svg></button>
</main>

<main class="view" id="lesson" hidden>
  <div class="top">
    <button type="button" class="back" data-home aria-label="Back to lessons"><svg><use href="#i-back"/></svg>Lessons</button>
  </div>
  <div class="lesson-head"><h1 id="lessonTitle"></h1><p class="sub" id="lessonMeta"></p></div>
  <div class="actions">
    <button type="button" class="primary" id="play">Play for score<small>10 s per word</small></button>
    <button type="button" class="ghost" id="practise">Practise<small>No score</small></button>
  </div>
  <div class="section">
    <p class="label">Leaderboard <span class="mono">Top 10</span></p>
    <div class="board" id="board"></div>
  </div>
</main>

<main class="view" id="game" hidden>
  <div class="top">
    <button type="button" class="quit" id="quit" aria-label="Quit this round"><svg><use href="#i-x"/></svg>Quit</button>
    <div class="hud"><span class="q" id="qNum"></span><span class="score" id="gScore">0</span></div>
  </div>
  <div class="timer"><i id="timerFill"></i></div>
  <div class="card" id="qCard" aria-live="polite"></div>
  <div class="options" id="options"></div>
</main>

<main class="view" id="result" hidden>
  <div class="result">
    <p class="label" id="rLesson"></p>
    <div class="final" id="rScore"></div>
    <p class="sub" id="rDetail"></p>
    <p class="rankline" id="rRank"></p>
  </div>
  <form class="arcade" id="nameForm">
    <label class="label" for="nameInput">Your name for the board</label>
    <input id="nameInput" maxlength="12" autocomplete="nickname" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="Name" required>
    <button type="submit" class="primary" id="saveBtn">Save to leaderboard</button>
    <p class="msg" id="saveMsg" hidden></p>
  </form>
  <div class="row">
    <button type="button" id="replay">Play again</button>
    <button type="button" id="skipSave">Don't save</button>
  </div>
</main>

<main class="view" id="practice" hidden>
  <div class="top">
    <button type="button" class="back" id="endPractice" aria-label="Back to lesson"><svg><use href="#i-back"/></svg><span id="pTitle"></span></button>
    <span class="crumb">Practice</span>
  </div>
  <div class="seg">
    <button type="button" data-dir="zh" aria-pressed="true" id="dirTarget">Chinese first</button>
    <button type="button" data-dir="en" aria-pressed="false">English first</button>
  </div>
  <div>
    <div class="progress"><span id="pLeft"></span><span id="pKnown"></span></div>
    <div class="bar"><i id="pBar"></i></div>
  </div>
  <div class="card" id="pCard" role="button" tabindex="0" aria-label="Flip card"></div>
  <div class="row" id="pGrade">
    <button type="button" class="again" id="pAgain">Again</button>
    <button type="button" class="gotit" id="pGot">Got it</button>
  </div>
</main>

<main class="view" id="words" hidden>
  <div class="top">
    <button type="button" class="back" data-home aria-label="Back to lessons"><svg><use href="#i-back"/></svg>Lessons</button>
  </div>
  <h1>Word list</h1>
  <div class="search" style="margin-top:20px">
    <input id="q" type="search" placeholder="Search Chinese, pinyin or English"  aria-label="Search vocabulary">
    <button type="button" id="toggleEn" aria-pressed="false">Hide English</button>
  </div>
  <div class="words" id="wordList"></div>
</main>

<script>
const SUPABASE_URL="https://cfljidsexwvhalvvlbxi.supabase.co";
const SUPABASE_KEY="sb_publishable_kxC0kvIBXsHCeXVf6yosbg_b-nAEO6N";
const TIME_LIMIT=10000;
const PREVIEW=true;

const LANG={
  zh:{data:ZH,title:"Mandarin flashcards",doc:"Mandarin Flashcards",first:"Chinese first",search:"Search Chinese, pinyin or English",cls:"zh",tag:"zh-CN",key:n=>n,nameKey:"mandarin-name"},
  de:{data:DE,title:"German flashcards",doc:"German Flashcards",first:"German first",search:"Search German or English",cls:"de",tag:"de",key:n=>"de:"+n,nameKey:"mandarin-name"}
};
let lang=store.get("flash-lang")==="de"?"de":"zh";
let D=LANG[lang].data;
const L=()=>LANG[lang];
const fw=(w,cls="")=>`<span class="${cls} ${L().cls}" lang="${L().tag}">${esc(w[0])}</span>`;
const pyOf=w=>w[1]?`<span class="py">${esc(w[1])}</span>`:"";
const words=name=>{const seen=new Set();return D.find(d=>d[0]===name)[1].filter(w=>{const k=w[0]+"|"+w[2];if(seen.has(k))return false;seen.add(k);return true})};

let scores=[],scoresError=false,current=null,lastSavedId=null;

function show(id){
  document.querySelectorAll("main.view").forEach(v=>v.hidden=v.id!==id);
  window.scrollTo(0,0);
}

async function api(path,opts={}){
  const res=await fetch(`${SUPABASE_URL}/rest/v1/${path}`,{...opts,headers:{apikey:SUPABASE_KEY,"Content-Type":"application/json",...opts.headers}});
  if(!res.ok)throw new Error(`${res.status}`);
  return res.status===204?null:res.json();
}

async function loadScores(){
  try{scores=await api("scores?select=id,lesson,name,score,correct,total,created_at&order=score.desc,created_at.asc&limit=5000");scoresError=false}
  catch{scoresError=true}
}

const boardFor=lesson=>scores.filter(s=>s.lesson===L().key(lesson));

function renderHome(){
  const wins={};
  for(const [name] of D){const top=boardFor(name)[0];if(top)wins[top.name]=(wins[top.name]||0)+1}
  const ranked=Object.entries(wins).sort((a,b)=>b[1]-a[1]);
  $("standings").innerHTML=scoresError?`<div class="msg-cell"><div class="who">Scores could not load</div><div class="sub">Check your connection and reopen.</div></div>`:
    ranked.length?ranked.slice(0,3).map(([n,c],i)=>`<div class="${i===0&&c>(ranked[1]?.[1]||0)?"lead":""}"><div class="n">${c}</div><div class="who">${esc(n)}</div></div>`).join(""):
    `<div class="msg-cell"><div class="who">No scores yet</div><div class="sub">Play a lesson to claim it.</div></div>`;
  $("lessonList").innerHTML=D.map(([name],i)=>{
    const top=boardFor(name)[0];
    return `<button type="button" class="lesson" data-lesson="${esc(name)}"><span class="idx">${String(i+1).padStart(2,"0")}</span><div class="grow"><div class="name">${esc(name)}</div><div class="meta">${words(name).length} words</div></div><div class="best">${top?`<b>${fmt(top.score)}</b>${esc(top.name)}`:`<span class="none">Unclaimed</span>`}</div></button>`;
  }).join("");
}

function renderBoard(lesson){
  const rows=boardFor(lesson).slice(0,10);
  if(scoresError){$("board").innerHTML=`<p class="empty">Scores could not load. Check your connection.</p>`;return}
  $("board").innerHTML=rows.length?`<ol>${rows.map((s,i)=>`<li class="${s.id===lastSavedId?"me":""}"><span class="rank">${i+1}</span><span class="nm">${esc(s.name)}</span><span class="pts">${fmt(s.score)}</span><span class="det">${s.correct} of ${s.total} right · ${new Date(s.created_at).toLocaleDateString("en-GB",{day:"numeric",month:"short"})}</span></li>`).join("")}</ol>`:
    `<p class="empty">No scores yet. First to play takes the top spot.</p>`;
}

function openLesson(name){
  current=name;
  $("lessonTitle").textContent=name;
  $("lessonMeta").textContent=`${words(name).length} words`;
  renderBoard(name);
  show("lesson");
}

function setLang(l){
  lang=l;D=LANG[l].data;store.set("flash-lang",l);
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===l));
  $("homeTitle").textContent=L().title;
  document.title=L().doc;
  $("dirTarget").textContent=L().first;
  $("q").placeholder=L().search;
  renderHome();
}
document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));

$("lessonList").addEventListener("click",e=>{const b=e.target.closest("[data-lesson]");if(b)openLesson(b.dataset.lesson)});
document.querySelectorAll("[data-home]").forEach(b=>b.addEventListener("click",()=>{renderHome();show("home")}));

let G=null,raf=0;

function startGame(){
  const pool=words(current);
  G={lesson:current,pool,questions:shuffle([...pool]).map(w=>({w,dir:Math.random()<.5?"zh":"en"})),i:0,score:0,correct:0,locked:false,start:0};
  show("game");
  nextQuestion();
}

function nextQuestion(){
  cancelAnimationFrame(raf);
  if(G.i>=G.questions.length)return finishGame();
  const {w,dir}=G.questions[G.i];
  const others=shuffle(G.pool.filter(o=>o[0]!==w[0]&&o[2]!==w[2])).slice(0,3);
  const opts=shuffle([w,...others]);
  $("qNum").textContent=`${G.i+1} of ${G.questions.length}`;
  $("gScore").textContent=fmt(G.score);
  $("qCard").innerHTML=dir==="zh"
    ?`<span class="ask">What does this mean?</span><div class="word ${L().cls}" lang="${L().tag}">${esc(w[0])}</div>${w[1]?`<div class="py">${esc(w[1])}</div>`:""}`
    :`<span class="ask">How do you say</span><div class="word">${esc(w[2])}</div>`;
  $("options").innerHTML=opts.map(o=>`<button type="button" data-key="${esc(o[0]+"|"+o[2])}">${dir==="zh"?esc(o[2]):`${fw(o)}${o[1]?`<span class="opt-py">${esc(o[1])}</span>`:""}`}</button>`).join("");
  G.answer=w[0]+"|"+w[2];
  G.locked=false;
  G.start=performance.now();
  const tick=now=>{
    const left=Math.max(0,1-(now-G.start)/TIME_LIMIT);
    $("timerFill").style.transform=`scaleX(${left})`;
    if(left<=0)return answer(null);
    raf=requestAnimationFrame(tick);
  };
  raf=requestAnimationFrame(tick);
}

function answer(key){
  if(G.locked)return;
  G.locked=true;
  cancelAnimationFrame(raf);
  const left=Math.max(0,1-(performance.now()-G.start)/TIME_LIMIT);
  const ok=key===G.answer;
  const pts=ok?100+Math.round(100*left):0;
  G.score+=pts;
  if(ok)G.correct++;
  $("gScore").textContent=fmt(G.score);
  $("options").querySelectorAll("button").forEach(b=>{
    b.disabled=true;
    if(b.dataset.key===G.answer)b.classList.add("right");
    else if(b.dataset.key===key)b.classList.add("wrong");
  });
  $("qCard").insertAdjacentHTML("beforeend",`<span class="pop ${ok?"":"miss"}">${ok?`+${pts}`:key===null?"Time up":"Miss"}</span>`);
  G.i++;
  setTimeout(()=>{if(G&&!$("game").hidden)nextQuestion()},ok?750:1600);
}

$("options").addEventListener("click",e=>{const b=e.target.closest("button");if(b&&G)answer(b.dataset.key)});
$("quit").addEventListener("click",()=>{cancelAnimationFrame(raf);G=null;openLesson(current)});

function finishGame(){
  const board=boardFor(G.lesson);
  const rank=board.filter(s=>s.score>G.score).length+1;
  $("rLesson").textContent=G.lesson;
  $("rScore").textContent=fmt(G.score);
  $("rDetail").textContent=`${G.correct} of ${G.questions.length} right`;
  $("rRank").textContent=rank===1?(board.length?"New top score":"First score on this lesson"):rank<=10?`That would be number ${rank} on the board`:"";
  $("nameInput").value=store.get("mandarin-name")||"";
  $("saveMsg").hidden=true;
  $("saveBtn").disabled=false;
  $("saveBtn").textContent="Save to leaderboard";
  show("result");
}

$("nameForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const name=$("nameInput").value.trim().toUpperCase().slice(0,12);
  if(!name||!G)return;
  if(PREVIEW){$("saveMsg").textContent="Design preview: scores are not saved here.";$("saveMsg").hidden=false;return}
  $("saveBtn").disabled=true;
  $("saveBtn").textContent="Saving";
  try{
    const [row]=await api("scores",{method:"POST",headers:{Prefer:"return=representation"},body:JSON.stringify({lesson:L().key(G.lesson),name,score:G.score,correct:G.correct,total:G.questions.length})});
    store.set("mandarin-name",name);
    lastSavedId=row.id;
    await loadScores();
    G=null;
    openLesson(current);
  }catch{
    $("saveMsg").textContent="Could not save. Check your connection and try again.";
    $("saveMsg").hidden=false;
    $("saveBtn").disabled=false;
    $("saveBtn").textContent="Try again";
  }
});
$("replay").addEventListener("click",startGame);
$("skipSave").addEventListener("click",()=>{G=null;openLesson(current)});
$("play").addEventListener("click",startGame);

let P=null,pDir="zh";
function startPractice(){
  P={deck:shuffle(words(current).map(w=>[...w])),total:0,known:0,flipped:false};
  P.total=P.deck.length;
  $("pTitle").textContent=current;
  show("practice");
  drawPractice();
}
function drawPractice(){
  const {deck,total,known,flipped}=P;
  $("pLeft").textContent=`${deck.length} left`;
  $("pKnown").textContent=`${known} of ${total} known`;
  $("pBar").style.width=`${known/total*100}%`;
  $("pGrade").hidden=!deck.length||!flipped;
  if(!deck.length){
    $("pCard").innerHTML=`<div class="word">All ${total} done</div><p class="hint">Ready to play this lesson for points?</p><button type="button" class="primary" id="pToGame">Play for score</button>`;
    $("pToGame").addEventListener("click",e=>{e.stopPropagation();startGame()});
    return;
  }
  const [zh,py,en]=deck[0];
  const tgt=cls=>`<div class="${cls} ${L().cls}" lang="${L().tag}">${esc(zh)}</div>${py?`<div class="py">${esc(py)}</div>`:""}`;
  const front=pDir==="zh"?tgt("word"):`<div class="word">${esc(en)}</div>`;
  const back=pDir==="zh"?`<div class="en">${esc(en)}</div>`:tgt("");
  $("pCard").innerHTML=front+(flipped?`<div class="reveal">${back}</div>`:`<span class="hint">Tap to reveal</span>`);
}
function pGrade(ok){
  if(!P.deck.length||!P.flipped)return;
  const c=P.deck.shift();
  if(ok)P.known++;else P.deck.splice(Math.min(P.deck.length,3+Math.floor(Math.random()*4)),0,c);
  P.flipped=false;
  drawPractice();
}
$("practise").addEventListener("click",startPractice);
$("endPractice").addEventListener("click",()=>openLesson(current));
$("pCard").addEventListener("click",()=>{if(P.deck.length){P.flipped=!P.flipped;drawPractice()}});
$("pAgain").addEventListener("click",()=>pGrade(false));
$("pGot").addEventListener("click",()=>pGrade(true));
document.querySelectorAll("[data-dir]").forEach(b=>b.addEventListener("click",()=>{
  pDir=b.dataset.dir;
  document.querySelectorAll("[data-dir]").forEach(x=>x.setAttribute("aria-pressed",x===b));
  P.flipped=false;
  drawPractice();
}));

function renderWords(){
  const term=strip($("q").value.trim());
  let html="";
  for(const [name,list] of D){
    const rows=list.filter(w=>!term||w.some(x=>strip(x).includes(term)));
    if(!rows.length)continue;
    html+=`<section><h2>${esc(name)}<span>${rows.length} words</span></h2>${rows.map(w=>`<div class="w">${fw(w)}${pyOf(w)}<span class="en">${esc(w[2])}</span></div>`).join("")}</section>`;
  }
  $("wordList").innerHTML=html||`<p class="sub">No words match “${esc($("q").value)}”.</p>`;
}
$("openWords").addEventListener("click",()=>{renderWords();show("words")});
$("q").addEventListener("input",renderWords);
$("toggleEn").addEventListener("click",e=>{
  const on=e.currentTarget.getAttribute("aria-pressed")!=="true";
  e.currentTarget.setAttribute("aria-pressed",on);
  e.currentTarget.textContent=on?"Show English":"Hide English";
  $("wordList").classList.toggle("hide-en",on);
});

document.addEventListener("visibilitychange",async()=>{
  if(document.visibilityState==="visible"&&(!$("home").hidden||!$("lesson").hidden)){
    await loadScores();
    if(!$("home").hidden)renderHome();else renderBoard(current);
  }
});

setLang(lang);
loadScores().then(renderHome);
</script>
</body>
