<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mandarin Flashcards</title>
<meta name="description" content="Mandarin vocab flashcards with a leaderboard for every lesson.">
<meta name="theme-color" content="#f3eee3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171511" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mandarin">
<link rel="apple-touch-icon" href="../../icon-180.png">
<link rel="icon" href="../../icon-180.png">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=Instrument+Sans:ital,wght@0,400..600;1,400..500&family=Noto+Serif+SC:wght@400;600&display=swap">
<style>
:root{--bg:#f3eee3;--ink:#221d17;--soft:#4a4238;--muted:#877c6d;--rule:#d8cebd;--rule-strong:#221d17;--accent:#a93a22;--accent-wash:#ecdccb;--good:#3d6a4a;--mark:#e9dfc7;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171511;--ink:#ebe3d3;--soft:#c4baa8;--muted:#8d8474;--rule:#34302a;--rule-strong:#ebe3d3;--accent:#e38563;--accent-wash:#2e211b;--good:#9cc3a4;--mark:#26221c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171511;--ink:#ebe3d3;--soft:#c4baa8;--muted:#8d8474;--rule:#34302a;--rule-strong:#ebe3d3;--accent:#e38563;--accent-wash:#2e211b;--good:#9cc3a4;--mark:#26221c;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Instrument Sans",system-ui,sans-serif;padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 40px);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
.view{max-width:540px;margin:0 auto;display:flex;flex-direction:column}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
button,input{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer;border:0;background:none;padding:0;min-height:44px;border-radius:0;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.serif,h1,h2,.final{font-family:Fraunces,Georgia,serif;font-optical-sizing:auto}
.zh{font-family:"Noto Serif SC","Songti SC",serif;font-weight:400}
h1{font-size:2.6rem;line-height:1.02;margin:0;font-weight:400;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:1.25rem;margin:0;font-weight:400}
.sub{color:var(--soft);margin:12px 0 0;font-size:.98rem;max-width:32ch}
.kicker{font-family:Fraunces,Georgia,serif;font-style:italic;font-size:1.05rem;color:var(--muted);margin:0}
.head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--rule-strong);padding-bottom:6px;margin:40px 0 0}
.head .aside{font-size:.82rem;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 22px;border:1px solid var(--rule-strong);font-weight:500;font-size:1rem;border-radius:2px;transition:background .15s,color .15s}
.btn:active{opacity:.8}
.primary{background:var(--ink);color:var(--bg);border:1px solid var(--ink);border-radius:2px;font-weight:500}
.primary:disabled{opacity:.6}
.textlink{display:inline-flex;align-items:center;gap:8px;color:var(--soft);font-size:.95rem;font-weight:500}
.textlink svg{width:18px;height:18px}

.masthead{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--rule);padding-bottom:4px;margin-bottom:34px}
.masthead .issue{font-family:Fraunces,Georgia,serif;font-style:italic;color:var(--muted);font-size:.95rem}
.langs{display:flex;gap:18px}
.langs button{font-size:.95rem;color:var(--muted);font-weight:500;position:relative;padding:0 2px}
.langs button[aria-pressed="true"]{color:var(--ink)}
.langs button[aria-pressed="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-5px;height:2px;background:var(--accent)}

.standings{display:flex;margin-top:14px}
.standings>div{flex:1;min-width:0;padding:0 14px;border-left:1px solid var(--rule)}
.standings>div:first-child{padding-left:0;border-left:0}
.standings .n{font-family:Fraunces,Georgia,serif;font-size:2.4rem;line-height:1;font-weight:300;font-variant-numeric:lining-nums tabular-nums}
.standings .lead .n{color:var(--accent)}
.standings .who{font-size:.8rem;font-weight:600;letter-spacing:.08em;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.standings .sub{margin-top:2px;font-size:.88rem}

.lessons{display:flex;flex-direction:column;counter-reset:toc}
.lesson{display:grid;grid-template-columns:2.4rem 1fr auto;align-items:baseline;gap:0 8px;width:100%;padding:14px 0 13px;border-bottom:1px solid var(--rule);min-height:60px}
.lesson:active{background:var(--mark)}
.lesson .no{font-family:Fraunces,Georgia,serif;font-size:.95rem;color:var(--muted);font-variant-numeric:lining-nums tabular-nums}
.lesson .name{font-family:Fraunces,Georgia,serif;font-size:1.3rem;line-height:1.2}
.lesson .meta{color:var(--muted);font-size:.8rem;margin-top:1px}
.lesson .best{text-align:right;font-size:.75rem;color:var(--muted);letter-spacing:.06em}
.lesson .best b{display:block;font-family:Fraunces,Georgia,serif;font-weight:400;font-size:1.05rem;letter-spacing:0;color:var(--ink);font-variant-numeric:lining-nums tabular-nums}
.lesson .best i{font-family:Fraunces,Georgia,serif;letter-spacing:0;font-size:.9rem}
.more{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:28px;padding:14px 0;border-top:1px solid var(--rule-strong);border-bottom:1px solid var(--rule-strong);font-family:Fraunces,Georgia,serif;font-size:1.2rem}
.more svg{width:20px;height:20px;color:var(--accent)}
.colophon{margin:22px 0 0;color:var(--muted);font-size:.8rem;font-style:italic;font-family:Fraunces,Georgia,serif;text-align:center}

.back{margin:-8px 0 18px -2px;align-self:flex-start}
.titleblock{border-bottom:1px solid var(--rule);padding-bottom:20px}
.titleblock h1{font-size:2.9rem}
.actions{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:22px}
.actions .btn{padding:0 18px}

.board ol{list-style:none;margin:0;padding:0}
.board li{display:grid;grid-template-columns:2rem 1fr auto;gap:0 10px;align-items:baseline;padding:13px 0 12px;border-bottom:1px solid var(--rule)}
.board .rank{font-family:Fraunces,Georgia,serif;color:var(--muted);font-variant-numeric:lining-nums tabular-nums}
.board li:first-child .rank{color:var(--accent);font-style:italic}
.board .nm{font-weight:600;letter-spacing:.09em;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .pts{font-family:Fraunces,Georgia,serif;font-size:1.2rem;font-variant-numeric:lining-nums tabular-nums;text-align:right}
.board li:first-child .pts{font-size:1.45rem}
.board .det{grid-column:2/4;color:var(--muted);font-size:.8rem}
.board li.me{background:var(--mark);box-shadow:-8px 0 0 var(--mark),8px 0 0 var(--mark)}
.board .empty{padding:18px 0;color:var(--muted);font-family:Fraunces,Georgia,serif;font-style:italic;margin:0;border-bottom:1px solid var(--rule)}

.gamebar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hud{display:flex;align-items:center;gap:14px;font-variant-numeric:lining-nums tabular-nums}
.hud .q{color:var(--muted);font-size:.9rem}
.hud .score{font-family:Fraunces,Georgia,serif;font-size:1.5rem;line-height:1;padding-left:14px;border-left:1px solid var(--rule);min-width:3ch;text-align:right}
.timer{height:2px;background:var(--rule);margin-top:8px}
.timer i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left}

.card{position:relative;padding:34px 8px 30px;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;border-bottom:1px solid var(--rule)}
#qCard{margin-bottom:6px}
#pCard{cursor:pointer;margin-top:8px;min-height:min(300px,42vh)}
.card .ask{font-family:Fraunces,Georgia,serif;font-style:italic;color:var(--muted);font-size:1rem;margin-bottom:6px}
.card .word{font-family:Fraunces,Georgia,serif;font-size:clamp(1.8rem,8vw,2.4rem);line-height:1.12;text-wrap:balance}
.card .word.zh{font-family:"Noto Serif SC",serif;font-size:clamp(3.4rem,19vw,5.2rem);font-weight:400;line-height:1.1}
.card .word.de{font-size:clamp(2.1rem,10vw,2.9rem)}
.card .py{color:var(--accent);font-size:1.1rem;font-style:italic;letter-spacing:.01em;margin-top:4px}
.card .hint{color:var(--muted);font-size:.85rem;margin-top:18px;letter-spacing:.02em}
.card .reveal{margin-top:22px;padding-top:18px;border-top:1px solid var(--rule);min-width:55%;display:flex;flex-direction:column;align-items:center;gap:2px}
.card .reveal .en{font-family:Fraunces,Georgia,serif;font-size:1.45rem;font-style:italic}
.card .reveal .zh{font-size:2.6rem}
.card .reveal .de{font-family:Fraunces,Georgia,serif;font-size:1.8rem}
.card .primary{margin-top:20px;min-height:50px;padding:0 24px}
.pop{position:absolute;top:10px;right:0;font-family:Fraunces,Georgia,serif;font-size:1.1rem;color:var(--good);font-variant-numeric:lining-nums tabular-nums;animation:pop .6s ease-out}
.pop.miss{color:var(--accent);font-style:italic}
@keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}

.options{display:flex;flex-direction:column;counter-reset:opt}
.options button{counter-increment:opt;position:relative;display:flex;flex-direction:column;justify-content:center;min-height:64px;padding:10px 12px 10px 40px;border-bottom:1px solid var(--rule);font-size:1.08rem;line-height:1.3;transition:background .15s}
.options button::before{content:counter(opt,lower-alpha);position:absolute;left:4px;top:50%;transform:translateY(-52%);font-family:Fraunces,Georgia,serif;font-style:italic;color:var(--muted);font-size:1rem}
.options button:active{background:var(--mark)}
.options .zh{font-size:1.7rem;line-height:1.2}
.options .de{font-family:Fraunces,Georgia,serif;font-size:1.3rem}
.options .opt-py{font-size:.82rem;color:var(--muted);font-style:italic}
.options button.right{background:var(--mark);color:var(--good)}
.options button.right::before{content:"\2713";font-style:normal;color:var(--good)}
.options button.wrong{color:var(--accent)}
.options button.wrong::before{content:"\2717";font-style:normal;color:var(--accent)}
.options button.wrong>*,.options button.wrong{text-decoration:line-through;text-decoration-thickness:1px}
.options button:disabled{cursor:default}
.options button:disabled:not(.right):not(.wrong){opacity:.45}

.row{display:flex;gap:10px}
.row>button{flex:1}
.seg{display:flex;gap:22px;border-bottom:1px solid var(--rule);margin-top:18px}
.seg button{color:var(--muted);font-size:.95rem;font-weight:500;position:relative}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg button[aria-pressed="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent)}
.progress{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;font-variant-numeric:lining-nums tabular-nums;margin:16px 0 8px}
.bar{height:2px;background:var(--rule)}
.bar i{display:block;height:100%;width:0;background:var(--ink);transition:width .25s}
#pGrade{margin-top:18px}
.again{border:1px solid var(--rule-strong);color:var(--ink)}
.gotit{background:var(--ink);color:var(--bg);border:1px solid var(--ink)}
.again,.gotit{min-height:56px;border-radius:2px;font-weight:500;text-align:center}

.result{text-align:center;padding:10px 0 28px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;align-items:center}
.result .kicker{margin-bottom:10px}
.result .final{font-size:5.2rem;line-height:.95;font-weight:300;letter-spacing:-.03em;font-variant-numeric:lining-nums tabular-nums}
.result .sub{margin-top:12px}
.result .rankline{margin:8px 0 0;color:var(--accent);font-family:Fraunces,Georgia,serif;font-style:italic;font-size:1.1rem}
.rankline:empty{display:none}
.arcade{display:flex;flex-direction:column;gap:14px;margin-top:26px}
.arcade label{font-family:Fraunces,Georgia,serif;font-style:italic;color:var(--muted);text-align:center}
.arcade input{width:100%;font-family:Fraunces,Georgia,serif;font-size:2rem;letter-spacing:.16em;text-transform:uppercase;text-align:center;padding:8px 4px;border:0;border-bottom:1px solid var(--rule-strong);background:transparent;border-radius:0}
.arcade input:focus{outline:0;border-bottom:2px solid var(--accent)}
.arcade input::placeholder{letter-spacing:.02em;color:var(--muted);text-transform:none;font-style:italic;font-size:1.4rem}
.arcade .primary{min-height:54px;width:100%}
.msg{color:var(--accent);font-size:.9rem;text-align:center;margin:0}
.after{display:flex;justify-content:space-between;margin-top:14px}

.search{position:sticky;top:0;z-index:2;background:var(--bg);padding:calc(env(safe-area-inset-top) + 8px) 0 0;margin:14px 0 0;margin-top:calc(14px - env(safe-area-inset-top));display:flex;gap:14px;align-items:center;border-bottom:1px solid var(--rule-strong)}
.search input{flex:1;min-width:0;font-size:16px;padding:12px 0;border:0;background:transparent;border-radius:0}
.search input:focus{outline:0}
.search button{color:var(--accent);font-size:.9rem;font-weight:500;flex:none}
.words{display:flex;flex-direction:column;gap:6px}
.words section{margin-top:26px}
.words h2{display:flex;justify-content:space-between;align-items:baseline;font-size:1.45rem;padding-bottom:6px;border-bottom:1px solid var(--rule)}
.words h2 span{font-family:"Instrument Sans",sans-serif;font-size:.78rem;color:var(--muted)}
.w{display:grid;grid-template-columns:auto 1fr;gap:0 16px;padding:11px 0;border-bottom:1px solid var(--rule)}
.w .zh{font-size:1.5rem;line-height:1.25;grid-row:span 2;align-self:center;min-width:3em}
.w:has(.de){grid-template-columns:minmax(0,48%) 1fr}
.w .de{font-family:Fraunces,Georgia,serif;font-size:1.1rem;line-height:1.3;grid-row:span 2;align-self:center}
.w .py{color:var(--accent);font-size:.88rem;font-style:italic}
.w .en{color:var(--soft);font-size:.95rem;align-self:center}
.w:has(.py) .en{align-self:start}
.hide-en .w .en{color:transparent;background:var(--mark);border-radius:1px}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></symbol>
</svg>

<main class="view" id="home">
  <div class="masthead">
    <span class="issue">Flashcards</span>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="zh" aria-pressed="true">Mandarin</button>
      <button type="button" data-lang="de" aria-pressed="false">German</button>
    </div>
  </div>
  <h1 id="homeTitle">Mandarin flashcards</h1>
  <p class="sub">Pick a lesson, play for points, put your name on the board.</p>
  <div class="head"><h2>Lessons won</h2><span class="aside">Top score holders</span></div>
  <div class="standings" id="standings"></div>
  <div class="head"><h2>Contents</h2><span class="aside">Best score</span></div>
  <div class="lessons" id="lessonList"></div>
  <button type="button" class="more" id="openWords">Full word list <svg><use href="#i-next"/></svg></button>
</main>

<main class="view" id="lesson" hidden>
  <button type="button" class="textlink back" data-home aria-label="Back to lessons"><svg><use href="#i-back"/></svg>Contents</button>
  <div class="titleblock">
    <p class="kicker">Lesson</p>
    <h1 id="lessonTitle"></h1>
    <p class="sub" id="lessonMeta"></p>
    <div class="actions">
      <button type="button" class="btn primary" id="play">Play for score</button>
      <button type="button" class="btn" id="practise">Practise</button>
    </div>
  </div>
  <div class="head"><h2>Leaderboard</h2><span class="aside">Points</span></div>
  <div class="board" id="board"></div>
</main>

<main class="view" id="game" hidden>
  <div class="gamebar">
    <button type="button" class="textlink" id="quit" aria-label="Quit this round"><svg><use href="#i-x"/></svg>Quit</button>
    <div class="hud"><span class="q" id="qNum"></span><span class="score" id="gScore">0</span></div>
  </div>
  <div class="timer"><i id="timerFill"></i></div>
  <div class="card" id="qCard" aria-live="polite"></div>
  <div class="options" id="options"></div>
</main>

<main class="view" id="result" hidden>
  <div class="result">
    <p class="kicker" id="rLesson"></p>
    <div class="final" id="rScore"></div>
    <p class="sub" id="rDetail"></p>
    <p class="rankline" id="rRank"></p>
  </div>
  <form class="arcade" id="nameForm">
    <label for="nameInput">Sign the board</label>
    <input id="nameInput" maxlength="12" autocomplete="nickname" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="Your name" required>
    <button type="submit" class="btn primary" id="saveBtn">Save to leaderboard</button>
    <p class="msg" id="saveMsg" hidden></p>
  </form>
  <div class="after">
    <button type="button" class="textlink" id="replay">Play again</button>
    <button type="button" class="textlink" id="skipSave">Don't save</button>
  </div>
</main>

<main class="view" id="practice" hidden>
  <button type="button" class="textlink back" id="endPractice" aria-label="Back to lesson"><svg><use href="#i-back"/></svg>Lesson</button>
  <p class="kicker">Practice</p>
  <h1 id="pTitle"></h1>
  <div class="seg">
    <button type="button" data-dir="zh" aria-pressed="true" id="dirTarget">Chinese first</button>
    <button type="button" data-dir="en" aria-pressed="false">English first</button>
  </div>
  <div>
    <div class="progress"><span id="pLeft"></span><span id="pKnown"></span></div>
    <div class="bar"><i id="pBar"></i></div>
  </div>
  <div class="card" id="pCard" role="button" tabindex="0" aria-label="Flip card"></div>
  <div class="row" id="pGrade">
    <button type="button" class="again" id="pAgain">Again</button>
    <button type="button" class="gotit" id="pGot">Got it</button>
  </div>
</main>

<main class="view" id="words" hidden>
  <button type="button" class="textlink back" data-home aria-label="Back to lessons"><svg><use href="#i-back"/></svg>Contents</button>
  <h1>Word list</h1>
  <div class="search">
    <input id="q" type="search" placeholder="Search Chinese, pinyin or English"  aria-label="Search vocabulary">
    <button type="button" id="toggleEn" aria-pressed="false">Hide English</button>
  </div>
  <div class="words" id="wordList"></div>
</main>

const LANG={
  zh:{data:ZH,title:"Mandarin flashcards",doc:"Mandarin Flashcards",first:"Chinese first",search:"Search Chinese, pinyin or English",cls:"zh",tag:"zh-CN",key:n=>n,nameKey:"mandarin-name"},
  de:{data:DE,title:"German flashcards",doc:"German Flashcards",first:"German first",search:"Search German or English",cls:"de",tag:"de",key:n=>"de:"+n,nameKey:"mandarin-name"}
};
let lang=store.get("flash-lang")==="de"?"de":"zh";
let D=LANG[lang].data;
const L=()=>LANG[lang];
const fw=(w,cls="")=>`<span class="${cls} ${L().cls}" lang="${L().tag}">${esc(w[0])}</span>`;
const pyOf=w=>w[1]?`<span class="py">${esc(w[1])}</span>`:"";
const words=name=>{const seen=new Set();return D.find(d=>d[0]===name)[1].filter(w=>{const k=w[0]+"|"+w[2];if(seen.has(k))return false;seen.add(k);return true})};

let scores=[],scoresError=false,current=null,lastSavedId=null;

function show(id){
  document.querySelectorAll("main.view").forEach(v=>v.hidden=v.id!==id);
  window.scrollTo(0,0);
}

async function api(path,opts={}){
  const res=await fetch(`${SUPABASE_URL}/rest/v1/${path}`,{...opts,headers:{apikey:SUPABASE_KEY,"Content-Type":"application/json",...opts.headers}});
  if(!res.ok)throw new Error(`${res.status}`);
  return res.status===204?null:res.json();
}

async function loadScores(){
  try{scores=await api("scores?select=id,lesson,name,score,correct,total,created_at&order=score.desc,created_at.asc&limit=5000");scoresError=false}
  catch{scoresError=true}
}

const boardFor=lesson=>scores.filter(s=>s.lesson===L().key(lesson));

function renderHome(){
  const wins={};
  for(const [name] of D){const top=boardFor(name)[0];if(top)wins[top.name]=(wins[top.name]||0)+1}
  const ranked=Object.entries(wins).sort((a,b)=>b[1]-a[1]);
  $("standings").innerHTML=scoresError?`<div><div class="who">Scores could not load</div><div class="sub">Check your connection and reopen.</div></div>`:
    ranked.length?ranked.slice(0,3).map(([n,c],i)=>`<div class="${i===0&&c>(ranked[1]?.[1]||0)?"lead":""}"><div class="n">${c}</div><div class="who">${esc(n)}</div></div>`).join(""):
    `<div><div class="who">No scores yet</div><div class="sub">Play a lesson to claim it.</div></div>`;
  $("lessonList").innerHTML=D.map(([name],i)=>{
    const top=boardFor(name)[0];
    return `<button type="button" class="lesson" data-lesson="${esc(name)}"><span class="no">${String(i+1).padStart(2,"0")}</span><div class="grow"><div class="name">${esc(name)}</div><div class="meta">${words(name).length} words</div></div><div class="best">${top?`<b>${fmt(top.score)}</b>${esc(top.name)}`:"<i>Unclaimed</i>"}</div></button>`;
  }).join("");
}

function renderBoard(lesson){
  const rows=boardFor(lesson).slice(0,10);
  if(scoresError){$("board").innerHTML=`<p class="empty">Scores could not load. Check your connection.</p>`;return}
  $("board").innerHTML=rows.length?`<ol>${rows.map((s,i)=>`<li class="${s.id===lastSavedId?"me":""}"><span class="rank">${i+1}</span><span class="nm">${esc(s.name)}</span><span class="pts">${fmt(s.score)}</span><span class="det">${s.correct} of ${s.total} right · ${new Date(s.created_at).toLocaleDateString("en-GB",{day:"numeric",month:"short"})}</span></li>`).join("")}</ol>`:
    `<p class="empty">No scores yet. First to play takes the top spot.</p>`;
}

function openLesson(name){
  current=name;
  $("lessonTitle").textContent=name;
  $("lessonMeta").textContent=`${words(name).length} words`;
  renderBoard(name);
  show("lesson");
}

function setLang(l){
  lang=l;D=LANG[l].data;store.set("flash-lang",l);
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===l));
  $("homeTitle").textContent=L().title;
  document.title=L().doc;
  $("dirTarget").textContent=L().first;
  $("q").placeholder=L().search;
  renderHome();
}
document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>setLang(b.dataset.lang)));

$("lessonList").addEventListener("click",e=>{const b=e.target.closest("[data-lesson]");if(b)openLesson(b.dataset.lesson)});
document.querySelectorAll("[data-home]").forEach(b=>b.addEventListener("click",()=>{renderHome();show("home")}));

let G=null,raf=0;

function startGame(){
  const pool=words(current);
  G={lesson:current,pool,questions:shuffle([...pool]).map(w=>({w,dir:Math.random()<.5?"zh":"en"})),i:0,score:0,correct:0,locked:false,start:0};
  show("game");
  nextQuestion();
}

function nextQuestion(){
  cancelAnimationFrame(raf);
  if(G.i>=G.questions.length)return finishGame();
  const {w,dir}=G.questions[G.i];
  const others=shuffle(G.pool.filter(o=>o[0]!==w[0]&&o[2]!==w[2])).slice(0,3);
  const opts=shuffle([w,...others]);
  $("qNum").textContent=`${G.i+1} of ${G.questions.length}`;
  $("gScore").textContent=fmt(G.score);
  $("qCard").innerHTML=dir==="zh"
    ?`<span class="ask">What does this mean?</span><div class="word ${L().cls}" lang="${L().tag}">${esc(w[0])}</div>${w[1]?`<div class="py">${esc(w[1])}</div>`:""}`
    :`<span class="ask">How do you say</span><div class="word">${esc(w[2])}</div>`;
  $("options").innerHTML=opts.map(o=>`<button type="button" data-key="${esc(o[0]+"|"+o[2])}">${dir==="zh"?esc(o[2]):`${fw(o)}${o[1]?`<span class="opt-py">${esc(o[1])}</span>`:""}`}</button>`).join("");
  G.answer=w[0]+"|"+w[2];
  G.locked=false;
  G.start=performance.now();
  const tick=now=>{
    const left=Math.max(0,1-(now-G.start)/TIME_LIMIT);
    $("timerFill").style.transform=`scaleX(${left})`;
    if(left<=0)return answer(null);
    raf=requestAnimationFrame(tick);
  };
  raf=requestAnimationFrame(tick);
}

function answer(key){
  if(G.locked)return;
  G.locked=true;
  cancelAnimationFrame(raf);
  const left=Math.max(0,1-(performance.now()-G.start)/TIME_LIMIT);
  const ok=key===G.answer;
  const pts=ok?100+Math.round(100*left):0;
  G.score+=pts;
  if(ok)G.correct++;
  $("gScore").textContent=fmt(G.score);
  $("options").querySelectorAll("button").forEach(b=>{
    b.disabled=true;
    if(b.dataset.key===G.answer)b.classList.add("right");
    else if(b.dataset.key===key)b.classList.add("wrong");
  });
  $("qCard").insertAdjacentHTML("beforeend",`<span class="pop ${ok?"":"miss"}">${ok?`+${pts}`:key===null?"Time up":"Miss"}</span>`);
  G.i++;
  setTimeout(()=>{if(G&&!$("game").hidden)nextQuestion()},ok?750:1600);
}

$("options").addEventListener("click",e=>{const b=e.target.closest("button");if(b&&G)answer(b.dataset.key)});
$("quit").addEventListener("click",()=>{cancelAnimationFrame(raf);G=null;openLesson(current)});

function finishGame(){
  const board=boardFor(G.lesson);
  const rank=board.filter(s=>s.score>G.score).length+1;
  $("rLesson").textContent=G.lesson;
  $("rScore").textContent=fmt(G.score);
  $("rDetail").textContent=`${G.correct} of ${G.questions.length} right`;
  $("rRank").textContent=rank===1?(board.length?"New top score":"First score on this lesson"):rank<=10?`That would be number ${rank} on the board`:"";
  $("nameInput").value=store.get("mandarin-name")||"";
  $("saveMsg").hidden=true;
  $("saveBtn").disabled=false;
  $("saveBtn").textContent="Save to leaderboard";
  show("result");
}

$("nameForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const name=$("nameInput").value.trim().toUpperCase().slice(0,12);
  if(!name||!G)return;
  if(PREVIEW){$("saveMsg").textContent="Design preview: scores are not saved here.";$("saveMsg").hidden=false;return}
  $("saveBtn").disabled=true;
  $("saveBtn").textContent="Saving";
  try{
    const [row]=await api("scores",{method:"POST",headers:{Prefer:"return=representation"},body:JSON.stringify({lesson:L().key(G.lesson),name,score:G.score,correct:G.correct,total:G.questions.length})});
    store.set("mandarin-name",name);
    lastSavedId=row.id;
    await loadScores();
    G=null;
    openLesson(current);
  }catch{
    $("saveMsg").textContent="Could not save. Check your connection and try again.";
    $("saveMsg").hidden=false;
    $("saveBtn").disabled=false;
    $("saveBtn").textContent="Try again";
  }
});
$("replay").addEventListener("click",startGame);
$("skipSave").addEventListener("click",()=>{G=null;openLesson(current)});
$("play").addEventListener("click",startGame);

let P=null,pDir="zh";
function startPractice(){
  P={deck:shuffle(words(current).map(w=>[...w])),total:0,known:0,flipped:false};
  P.total=P.deck.length;
  $("pTitle").textContent=current;
  show("practice");
  drawPractice();
}
function drawPractice(){
  const {deck,total,known,flipped}=P;
  $("pLeft").textContent=`${deck.length} left`;
  $("pKnown").textContent=`${known} of ${total} known`;
  $("pBar").style.width=`${known/total*100}%`;
  $("pGrade").hidden=!deck.length||!flipped;
  if(!deck.length){
    $("pCard").innerHTML=`<div class="word">All ${total} done</div><p class="hint">Ready to play this lesson for points?</p><button type="button" class="primary" id="pToGame">Play for score</button>`;
    $("pToGame").addEventListener("click",e=>{e.stopPropagation();startGame()});
    return;
  }
  const [zh,py,en]=deck[0];
  const tgt=cls=>`<div class="${cls} ${L().cls}" lang="${L().tag}">${esc(zh)}</div>${py?`<div class="py">${esc(py)}</div>`:""}`;
  const front=pDir==="zh"?tgt("word"):`<div class="word">${esc(en)}</div>`;
  const back=pDir==="zh"?`<div class="en">${esc(en)}</div>`:tgt("");
  $("pCard").innerHTML=front+(flipped?`<div class="reveal">${back}</div>`:`<span class="hint">Tap to reveal</span>`);
}
function pGrade(ok){
  if(!P.deck.length||!P.flipped)return;
  const c=P.deck.shift();
  if(ok)P.known++;else P.deck.splice(Math.min(P.deck.length,3+Math.floor(Math.random()*4)),0,c);
  P.flipped=false;
  drawPractice();
}
$("practise").addEventListener("click",startPractice);
$("endPractice").addEventListener("click",()=>openLesson(current));
$("pCard").addEventListener("click",()=>{if(P.deck.length){P.flipped=!P.flipped;drawPractice()}});
$("pAgain").addEventListener("click",()=>pGrade(false));
$("pGot").addEventListener("click",()=>pGrade(true));
document.querySelectorAll("[data-dir]").forEach(b=>b.addEventListener("click",()=>{
  pDir=b.dataset.dir;
  document.querySelectorAll("[data-dir]").forEach(x=>x.setAttribute("aria-pressed",x===b));
  P.flipped=false;
  drawPractice();
}));

function renderWords(){
  const term=strip($("q").value.trim());
  let html="";
  for(const [name,list] of D){
    const rows=list.filter(w=>!term||w.some(x=>strip(x).includes(term)));
    if(!rows.length)continue;
    html+=`<section><h2>${esc(name)}<span>${rows.length} words</span></h2>${rows.map(w=>`<div class="w">${fw(w)}${pyOf(w)}<span class="en">${esc(w[2])}</span></div>`).join("")}</section>`;
  }
  $("wordList").innerHTML=html||`<p class="sub">No words match “${esc($("q").value)}”.</p>`;
}
$("openWords").addEventListener("click",()=>{renderWords();show("words")});
$("q").addEventListener("input",renderWords);
$("toggleEn").addEventListener("click",e=>{
  const on=e.currentTarget.getAttribute("aria-pressed")!=="true";
  e.currentTarget.setAttribute("aria-pressed",on);
  e.currentTarget.textContent=on?"Show English":"Hide English";
  $("wordList").classList.toggle("hide-en",on);
});

document.addEventListener("visibilitychange",async()=>{
  if(document.visibilityState==="visible"&&(!$("home").hidden||!$("lesson").hidden)){
    await loadScores();
    if(!$("home").hidden)renderHome();else renderBoard(current);
  }
});

setLang(lang);
loadScores().then(renderHome);
</script>
</body>
